#Server port :
server.port=8812

#Application name :
spring.application.name=product-recommendation-service

#Client registration properties :
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
eureka.instance.prefer-ip-address=true

#Data source :
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/ecommerce_recommendation?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

#Jpa/Hibernate :
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Actuator Config
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Resilience4j Feign integration
spring.cloud.openfeign.circuitbreaker.enabled=true
