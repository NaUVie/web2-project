server:
  port: 8900

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 30MB
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=2
        - id: product-catalog-service
          uri: lb://product-catalog-service
          predicates:
            - Path=/api/catalog/**
          filters:
            - StripPrefix=2
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/shop/**
          filters:
            - StripPrefix=2
        - id: product-recommendation-service
          uri: lb://product-recommendation-service
          predicates:
            - Path=/api/review/**
          filters:
            - StripPrefix=2
        - id: chatbot-service
          uri: lb://chatbot-service
          predicates:
            - Path=/api/chatbot/**
          filters:
            - StripPrefix=2
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: User Service (Accounts)
        url: /api/accounts/v3/api-docs
      - name: Catalog Service
        url: /api/catalog/v3/api-docs
      - name: Order Service (Shop)
        url: /api/shop/v3/api-docs
      - name: Recommendation Service (Review)
        url: /api/review/v3/api-docs
      - name: Payment Service
        url: /api/payment/v3/api-docs
